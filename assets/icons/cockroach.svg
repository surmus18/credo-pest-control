<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Flat oval body -->
  <ellipse cx="32" cy="36" rx="14" ry="10" fill="#6A3FD4"/>
  <!-- Head small -->
  <ellipse cx="32" cy="24" rx="7" ry="5" fill="#3B2FE8"/>
  <!-- Eyes (big compound) -->
  <circle cx="27" cy="23" r="3" fill="#E8E8FF"/>
  <circle cx="37" cy="23" r="3" fill="#E8E8FF"/>
  <circle cx="27.5" cy="23" r="1.5" fill="#0A0A12"/>
  <circle cx="37.5" cy="23" r="1.5" fill="#0A0A12"/>
  <!-- Antennae (long) -->
  <path d="M29 19 Q24 12 18 8" stroke="#3B2FE8" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M35 19 Q40 12 46 8" stroke="#3B2FE8" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Cerci (rear antennae) -->
  <path d="M26 44 Q20 50 16 56" stroke="#6A3FD4" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M38 44 Q44 50 48 56" stroke="#6A3FD4" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Body bands -->
  <line x1="18" y1="34" x2="46" y2="34" stroke="#3B2FE8" stroke-width="1" opacity="0.5"/>
  <line x1="18" y1="39" x2="46" y2="39" stroke="#3B2FE8" stroke-width="1" opacity="0.5"/>
  <!-- Legs -->
  <line x1="18" y1="30" x2="8" y2="26" stroke="#3B2FE8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="18" y1="35" x2="7" y2="35" stroke="#3B2FE8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="18" y1="40" x2="8" y2="46" stroke="#3B2FE8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="46" y1="30" x2="56" y2="26" stroke="#6A3FD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="46" y1="35" x2="57" y2="35" stroke="#6A3FD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="46" y1="40" x2="56" y2="46" stroke="#6A3FD4" stroke-width="1.5" stroke-linecap="round"/>
</svg>
