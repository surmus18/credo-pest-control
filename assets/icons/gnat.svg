<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Body (elongated) -->
  <ellipse cx="32" cy="38" rx="6" ry="14" fill="#6A3FD4"/>
  <!-- Head -->
  <circle cx="32" cy="21" r="6" fill="#3B2FE8"/>
  <!-- Eyes -->
  <circle cx="29" cy="20" r="1.8" fill="#E8E8FF"/>
  <circle cx="35" cy="20" r="1.8" fill="#E8E8FF"/>
  <circle cx="29.4" cy="20" r="0.9" fill="#0A0A12"/>
  <circle cx="35.4" cy="20" r="0.9" fill="#0A0A12"/>
  <!-- Antennae -->
  <line x1="30" y1="15" x2="27" y2="9" stroke="#3B2FE8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="34" y1="15" x2="37" y2="9" stroke="#3B2FE8" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="27" cy="9" r="1.5" fill="#6A3FD4"/>
  <circle cx="37" cy="9" r="1.5" fill="#6A3FD4"/>
  <!-- Wings (slim) -->
  <ellipse cx="20" cy="32" rx="10" ry="4" fill="#3B2FE8" opacity="0.5" transform="rotate(-10 20 32)"/>
  <ellipse cx="44" cy="32" rx="10" ry="4" fill="#6A3FD4" opacity="0.5" transform="rotate(10 44 32)"/>
  <!-- 6 legs -->
  <line x1="26" y1="32" x2="14" y2="28" stroke="#3B2FE8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="26" y1="38" x2="13" y2="38" stroke="#3B2FE8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="26" y1="44" x2="14" y2="50" stroke="#3B2FE8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="38" y1="32" x2="50" y2="28" stroke="#6A3FD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="38" y1="38" x2="51" y2="38" stroke="#6A3FD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="38" y1="44" x2="50" y2="50" stroke="#6A3FD4" stroke-width="1.5" stroke-linecap="round"/>
</svg>
