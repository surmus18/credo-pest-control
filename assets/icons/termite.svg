<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Termite body (large abdomen) -->
  <ellipse cx="32" cy="42" rx="11" ry="14" fill="#6A3FD4"/>
  <!-- Thorax -->
  <ellipse cx="32" cy="27" rx="7" ry="6" fill="#3B2FE8"/>
  <!-- Head (large, rectangular) -->
  <rect x="24" y="12" width="16" height="12" rx="4" fill="#3B2FE8"/>
  <!-- Mandibles -->
  <path d="M24 20 Q18 22 16 26" stroke="#6A3FD4" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M40 20 Q46 22 48 26" stroke="#6A3FD4" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Eyes -->
  <circle cx="27" cy="17" r="2" fill="#E8E8FF"/>
  <circle cx="37" cy="17" r="2" fill="#E8E8FF"/>
  <circle cx="27.4" cy="17" r="1" fill="#0A0A12"/>
  <circle cx="37.4" cy="17" r="1" fill="#0A0A12"/>
  <!-- Antennae -->
  <path d="M28 12 Q26 7 22 4" stroke="#3B2FE8" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <path d="M36 12 Q38 7 42 4" stroke="#3B2FE8" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Legs -->
  <line x1="25" y1="25" x2="13" y2="21" stroke="#3B2FE8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="25" y1="30" x2="12" y2="30" stroke="#3B2FE8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="25" y1="38" x2="13" y2="44" stroke="#3B2FE8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="39" y1="25" x2="51" y2="21" stroke="#6A3FD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="39" y1="30" x2="52" y2="30" stroke="#6A3FD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="39" y1="38" x2="51" y2="44" stroke="#6A3FD4" stroke-width="1.5" stroke-linecap="round"/>
</svg>
