  <line x1="25" y1="40" x2="12" y2="44" stroke="#6A3FD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="39" y1="32" x2="52" y2="28" stroke="#3B2FE8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="39" y1="36" x2="54" y2="36" stroke="#3B2FE8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="39" y1="40" x2="52" y2="44" stroke="#3B2FE8" stroke-width="1.5" stroke-linecap="round"/>
