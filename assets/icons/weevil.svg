<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Body oval -->
  <ellipse cx="32" cy="36" rx="11" ry="14" fill="#6A3FD4"/>
  <!-- Head -->
  <circle cx="32" cy="19" r="8" fill="#3B2FE8"/>
  <!-- Long snout/beak -->
  <ellipse cx="32" cy="11" rx="2.5" ry="6" fill="#3B2FE8"/>
  <!-- Eyes -->
  <circle cx="28" cy="18" r="2" fill="#E8E8FF"/>
  <circle cx="36" cy="18" r="2" fill="#E8E8FF"/>
  <circle cx="28.4" cy="18" r="1" fill="#0A0A12"/>
  <circle cx="36.4" cy="18" r="1" fill="#0A0A12"/>
  <!-- Body ridges -->
  <line x1="21" y1="33" x2="43" y2="33" stroke="#3B2FE8" stroke-width="1" opacity="0.6"/>
  <line x1="21" y1="39" x2="43" y2="39" stroke="#3B2FE8" stroke-width="1" opacity="0.6"/>
  <line x1="21" y1="45" x2="43" y2="45" stroke="#3B2FE8" stroke-width="1" opacity="0.6"/>
  <!-- Legs -->
  <line x1="21" y1="30" x2="10" y2="27" stroke="#3B2FE8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="21" y1="36" x2="9" y2="36" stroke="#3B2FE8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="21" y1="42" x2="10" y2="47" stroke="#3B2FE8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="43" y1="30" x2="54" y2="27" stroke="#6A3FD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="43" y1="36" x2="55" y2="36" stroke="#6A3FD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="43" y1="42" x2="54" y2="47" stroke="#6A3FD4" stroke-width="1.5" stroke-linecap="round"/>
</svg>
