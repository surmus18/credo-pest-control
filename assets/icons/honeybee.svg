<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Wings -->
  <ellipse cx="20" cy="20" rx="13" ry="6" fill="#6A3FD4" opacity="0.6" transform="rotate(-25 20 20)"/>
  <ellipse cx="44" cy="20" rx="13" ry="6" fill="#3B2FE8" opacity="0.6" transform="rotate(25 44 20)"/>
  <!-- Body stripes -->
  <ellipse cx="32" cy="37" rx="8" ry="13" fill="#3B2FE8"/>
  <rect x="24" y="30" width="16" height="4" rx="2" fill="#6A3FD4"/>
  <rect x="24" y="38" width="16" height="4" rx="2" fill="#6A3FD4"/>
  <rect x="24" y="46" width="16" height="3" rx="2" fill="#6A3FD4"/>
  <!-- Head -->
  <circle cx="32" cy="21" r="6" fill="#6A3FD4"/>
  <!-- Eyes -->
  <circle cx="29" cy="20" r="1.8" fill="#E8E8FF"/>
  <circle cx="35" cy="20" r="1.8" fill="#E8E8FF"/>
  <circle cx="29.4" cy="20" r="0.9" fill="#0A0A12"/>
  <circle cx="35.4" cy="20" r="0.9" fill="#0A0A12"/>
  <!-- Antennae -->
  <line x1="30" y1="15" x2="25" y2="9" stroke="#6A3FD4" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="34" y1="15" x2="39" y2="9" stroke="#6A3FD4" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="25" cy="9" r="1.5" fill="#3B2FE8"/>
  <circle cx="39" cy="9" r="1.5" fill="#3B2FE8"/>
  <!-- Stinger -->
  <polygon points="32,50 29,56 35,56" fill="#6A3FD4"/>
  <!-- Legs -->
  <line x1="24" y1="33" x2="12" y2="29" stroke="#3B2FE8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="38" x2="10" y2="38" stroke="#3B2FE8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="40" y1="33" x2="52" y2="29" stroke="#3B2FE8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="40" y1="38" x2="54" y2="38" stroke="#3B2FE8" stroke-width="1.5" stroke-linecap="round"/>
</svg>
